name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --pwa-strategy=none

      - name: Verify SEO landing pages
        shell: bash
        run: |
          set -euo pipefail

          seo_files=(
            "seo.css"
            "robots.txt"
            "sitemap.xml"
            "app-entwickler/index.html"
            "flutter-entwickler/index.html"
            "android-entwickler/index.html"
            "ios-entwickler/index.html"
            "app-entwickler-berlin/index.html"
            "flutter-entwickler-berlin/index.html"
            "android-entwickler-berlin/index.html"
            "ios-entwickler-berlin/index.html"
            "app-programmieren-lassen/index.html"
            "mvp-app-entwicklung/index.html"
            "startup-app-entwicklung/index.html"
            "portfolio/index.html"
          )

          for file in "${seo_files[@]}"; do
            test -f "build/web/$file"
          done

          grep -Fq "https://jchillah.github.io/jchillah_company_site/sitemap.xml" build/web/robots.txt
          grep -Fq "<urlset" build/web/sitemap.xml

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JCHILLAH_COMPANY_SITE }}
          channelId: live
          projectId: jchillah-company-site
